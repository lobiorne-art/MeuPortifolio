<section>
  <div class="container">
    <h2 class="text-center mb-4">Contato</h2>

    <form id="formContato">
      <input type="text" id="nome" class="form-control mb-3" placeholder="Seu nome" required>
      <input type="email" id="email" class="form-control mb-3" placeholder="Seu e-mail" required>
      <textarea id="mensagem" class="form-control mb-3" rows="4" placeholder="Sua mensagem" required></textarea>
      <button type="submit" class="btn btn-danger">Enviar</button>
    </form>

    <!-- Botão discreto para abrir o painel -->
    <button id="btnAdmin" class="btn btn-sm btn-outline-secondary mt-5">Admin</button>

    <!-- Painel escondido (d-none = invisível) -->
    <div id="painelAdmin" class="d-none mt-3">
      <h3>Mensagens recebidas</h3>
      <table class="table table-dark">
        <thead>
          <tr><th>Nome</th><th>E-mail</th><th>Mensagem</th><th>Ações</th></tr>
        </thead>
        <tbody id="listaMensagens"></tbody>
      </table>
    </div>
  </div>
</section>
